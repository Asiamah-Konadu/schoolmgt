<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Teacher Portal</title>
    <meta name="description" content="Communicate with parents of your students">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/teacher-portal.css">
    <style>
        .tab-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: var(--radius-md); padding: 0.5rem 1.25rem; margin-right: 0.5rem; cursor: pointer; transition: var(--transition); font-size: 0.875rem; }
        .tab-btn.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
        .tab-btn:hover:not(.active) { border-color: var(--accent-primary); color: var(--text-primary); }

        .message-item { padding: 1rem 1.25rem; border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-md); margin-bottom: 0.5rem; cursor: pointer; transition: var(--transition); }
        .message-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
        .message-item.unread { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.25); }
        .message-item.unread::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-primary); margin-right: 0.5rem; vertical-align: middle; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar flex-col"></aside>

    <main>
        <div class="mobile-top-bar">
            <button onclick="window.UI?.toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;" aria-label="Toggle menu">☰</button>
            <span class="font-bold">Messages</span>
            <div style="width:24px;"></div>
        </div>

        <div class="p-8">
            <header class="mb-8">
                <h1 class="text-2xl">Messaging System</h1>
                <p class="text-muted">Communicate with parents of your students.</p>
            </header>

            <section class="max-w-4xl">
                <div class="flex mb-6">
                    <button class="tab-btn active" id="tabInbox" onclick="showTab('inbox')">📥 Inbox</button>
                    <button class="tab-btn" id="tabSent" onclick="showTab('sent')">📤 Sent</button>
                    <button class="tab-btn" id="tabCompose" onclick="showTab('compose')">✏ Compose</button>
                </div>

                <div id="inboxTab" class="glass-panel p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2>Inbox</h2>
                        <span id="inboxCount" class="text-xs text-muted"></span>
                    </div>
                    <div id="messagesList"><p class="text-muted text-sm">Loading...</p></div>
                </div>

                <div id="sentTab" class="glass-panel p-6" style="display:none;">
                    <h2 class="mb-6">Sent Messages</h2>
                    <div id="sentMessagesList"><p class="text-muted text-sm">Loading...</p></div>
                </div>

                <div id="composeTab" class="glass-panel p-6" style="display:none;">
                    <h2 class="mb-6">Compose New Message</h2>
                    <form id="messageForm">
                        <div class="form-group mb-4">
                            <label class="form-label" for="recipient">Recipient (Parent)</label>
                            <select id="recipient" class="form-control" required>
                                <option value="">Select parent...</option>
                            </select>
                        </div>
                        <div class="form-group mb-4">
                            <label class="form-label" for="msgSubject">Subject</label>
                            <input type="text" id="msgSubject" class="form-control" placeholder="e.g. Academic Progress Update" required>
                        </div>
                        <div class="form-group mb-4">
                            <label class="form-label" for="msgBody">Message</label>
                            <textarea id="msgBody" class="form-control" rows="6" placeholder="Type your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">📤 Send Message</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="../js/firebase-db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/teacher-nav.js"></script>
    <script>
        Auth.requireAuth(['teacher']);
        const user = Auth.getCurrentUser();

        async function loadMessages() {
            const container = document.getElementById('messagesList');
            try {
                const res = await ApiClient.request('teacher.php', { action: 'get_messages', teacherId: user.id });
                const messages = res.data;
                container.innerHTML = '';

                const unread = messages.filter(m => !m.is_read).length;
                document.getElementById('inboxCount').textContent = unread > 0 ? `${unread} unread` : `${messages.length} messages`;

                if (messages.length === 0) {
                    container.innerHTML = `<div class="text-center py-8"><div style="font-size:2.5rem; margin-bottom:0.75rem;">📭</div><p class="text-muted">No messages yet.</p></div>`;
                    return;
                }

                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message-item ${msg.is_read ? '' : 'unread'}`;
                    div.onclick = () => viewMessage(msg.id);
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <strong>${msg.sender_name} <span class="text-muted" style="font-weight:400;">(${msg.sender_role})</span></strong>
                            <small class="text-muted">${new Date(msg.created_at).toLocaleString()}</small>
                        </div>
                        <div class="font-medium mb-1">${msg.subject}</div>
                        <div class="text-sm text-secondary">${msg.message.substring(0, 100)}${msg.message.length > 100 ? '...' : ''}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p class="text-danger text-sm">Failed to load messages.</p>';
            }
        }

        async function loadSentMessages() {
            const container = document.getElementById('sentMessagesList');
            try {
                const res = await ApiClient.request('teacher.php', { action: 'get_sent_messages', teacherId: user.id });
                const sent = res.data;
                container.innerHTML = '';

                if (sent.length === 0) {
                    container.innerHTML = `<div class="text-center py-8"><div style="font-size:2.5rem; margin-bottom:0.75rem;">📤</div><p class="text-muted">No sent messages yet.</p></div>`;
                    return;
                }

                sent.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message-item';
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <strong>To: ${msg.recipient_name} <span class="text-muted" style="font-weight:400;">(${msg.recipient_role})</span></strong>
                            <small class="text-muted">${new Date(msg.created_at).toLocaleString()}</small>
                        </div>
                        <div class="font-medium mb-1">${msg.subject}</div>
                        <div class="text-sm text-secondary">${msg.message.substring(0, 100)}${msg.message.length > 100 ? '...' : ''}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p class="text-danger text-sm">Failed to load sent messages.</p>';
            }
        }

        async function loadRecipients() {
            try {
                const res = await ApiClient.request('teacher.php', { action: 'get_recipients', teacherId: user.id });
                const recipients = res.data;
                const select = document.getElementById('recipient');
                select.innerHTML = '<option value="">Select parent...</option>';
                recipients.forEach(rec => {
                    const opt = document.createElement('option');
                    opt.value = rec.id;
                    opt.textContent = `${rec.name} (Parent)`;
                    select.appendChild(opt);
                });
            } catch (err) {}
        }

        async function viewMessage(id) {
            try {
                await ApiClient.request('teacher.php', { action: 'mark_message_read', messageId: id, teacherId: user.id });
                loadMessages();
            } catch (err) {}
        }

        function showTab(tab) {
            ['inbox','sent','compose'].forEach(t => {
                document.getElementById(t + 'Tab').style.display = t === tab ? 'block' : 'none';
                document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
            });
            if (tab === 'compose') loadRecipients();
            if (tab === 'sent') loadSentMessages();
        }

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;

            const recipientId = document.getElementById('recipient').value;
            const subject = document.getElementById('msgSubject').value;
            const message = document.getElementById('msgBody').value;

            try {
                await ApiClient.request('teacher.php', {
                    action: 'send_message',
                    teacherId: user.id,
                    recipientId,
                    subject,
                    message
                });
                showToast('Message sent successfully!', 'success');
                e.target.reset();
                showTab('inbox');
                loadMessages();
            } catch (err) {
                showToast('Failed to send message.', 'error');
            }
            btn.disabled = false;
        });

        document.addEventListener('DOMContentLoaded', loadMessages);
    </script>
</body>
</html>
