<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Teacher Portal</title>
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        .sidebar { background: var(--bg-glass); border-right: 1px solid var(--border-color); padding: 2rem 1rem; }
        .nav-link { display: flex; align-items: center; padding: 0.75rem 1rem; color: var(--text-secondary); border-radius: var(--radius-md); margin-bottom: 0.5rem; transition: var(--transition); }
        .nav-link:hover, .nav-link.active { background: var(--accent-glow); color: var(--text-primary); }
        .tab-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: var(--radius-md); padding: 0.5rem 1rem; margin-right: 0.5rem; cursor: pointer; transition: var(--transition); }
        .tab-btn.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
        .message-item { padding: 1rem; border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); margin-bottom: 0.5rem; cursor: pointer; transition: var(--transition); }
        .message-item:hover { background: rgba(255,255,255,0.05); }
        .message-item.unread { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); }
        .compose-form { display: none; }
    </style>
</head>
<body class="dashboard-layout">
    <aside class="sidebar flex-col">
        <h2 class="text-center mb-8" style="font-size: 1.25rem;">Teacher<br><span class="text-primary text-sm">Portal</span></h2>
        <nav class="flex-col w-full h-full">
           <a href="dashboard.html" class="nav-link ">Dashboard & Profile</a>
        <a href="timetable.html" class="nav-link">My Timetable</a>
        <a href="attendance.html" class="nav-link">Class Attendance</a>
        <a href="morning-attendance.html" class="nav-link" id="morningAttendanceTab" style="display: none">Morning Attendance</a>
        <a href="assignments.html" class="nav-link">Assignments</a>
        <a href="results.html" class="nav-link">Exam Results</a>
        <a href="promotion.html" class="nav-link">Student Promotion</a>
        <a href="messages.html" class="nav-link active">Messages</a>
            <div style="margin-top: auto;">
                <button onclick="Auth.logout()" class="btn btn-outline w-full mt-8">Logout</button>
            </div>
        </nav>
    </aside>

    <main class="p-8">
        <header class="mb-8">
            <h1 class="text-2xl">Messaging System</h1>
            <p class="text-muted">Communicate with parents of your students.</p>
        </header>

        <section class="max-w-6xl">
            <div class="flex mb-6">
                <button class="tab-btn active" onclick="showTab('inbox')">Inbox</button>
                <button class="tab-btn" onclick="showTab('sent')">Sent</button>
                <button class="tab-btn" onclick="showTab('compose')">Compose</button>
            </div>

            <div id="inboxTab" class="glass-panel p-6">
                <h2 class="mb-6">Inbox</h2>
                <div id="messagesList"></div>
            </div>

            <div id="sentTab" class="glass-panel p-6" style="display:none;">
                <h2 class="mb-6">Sent Messages</h2>
                <div id="sentMessagesList"></div>
            </div>

            <div id="composeTab" class="compose-form glass-panel p-6">
                <h2 class="mb-6">Compose Message</h2>
                <form id="messageForm">
                    <div class="form-group mb-4">
                        <label class="form-label" for="recipient">Recipient (Parent)</label>
                        <select id="recipient" class="form-control" required>
                            <option value="">Select parent...</option>
                        </select>
                    </div>
                    <div class="form-group mb-4">
                        <label class="form-label" for="subject">Subject</label>
                        <input type="text" id="subject" class="form-control" required>
                    </div>
                    <div class="form-group mb-4">
                        <label class="form-label" for="message">Message</label>
                        <textarea id="message" class="form-control" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.requireAuth(['teacher']);

        const user = Auth.getCurrentUser();
        if (user.assignedClass) {
            document.getElementById('morningAttendanceTab').style.display = 'flex';
        }

        async function loadMessages() {
            try {
                const res = await ApiClient.request('teacher.php', { action: 'get_messages', teacherId: user.id });
                const messages = res.data;
                const container = document.getElementById('messagesList');
                container.innerHTML = '';

                if (messages.length === 0) {
                    container.innerHTML = '<p class="text-muted">No messages.</p>';
                    return;
                }

                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message-item ${msg.is_read ? '' : 'unread'}`;
                    div.onclick = () => viewMessage(msg.id);
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <strong>${msg.sender_name} (${msg.sender_role})</strong>
                            <small class="text-muted">${new Date(msg.created_at).toLocaleString()}</small>
                        </div>
                        <div class="font-medium mb-1">${msg.subject}</div>
                        <div class="text-sm text-secondary">${msg.message.substring(0, 100)}${msg.message.length > 100 ? '...' : ''}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadSentMessages() {
            try {
                const res = await ApiClient.request('teacher.php', { action: 'get_sent_messages', teacherId: user.id });
                const sent = res.data;
                const container = document.getElementById('sentMessagesList');
                container.innerHTML = '';

                if (sent.length === 0) {
                    container.innerHTML = '<p class="text-muted">No sent messages.</p>';
                    return;
                }

                sent.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message-item';
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <strong>To: ${msg.recipient_name} (${msg.recipient_role})</strong>
                            <small class="text-muted">${new Date(msg.created_at).toLocaleString()}</small>
                        </div>
                        <div class="font-medium mb-1">${msg.subject}</div>
                        <div class="text-sm text-secondary">${msg.message.substring(0, 100)}${msg.message.length > 100 ? '...' : ''}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadRecipients() {
            try {
                const res = await ApiClient.request('teacher.php', { action: 'get_recipients', teacherId: user.id });
                const recipients = res.data;
                const select = document.getElementById('recipient');
                select.innerHTML = '<option value="">Select parent...</option>';
                recipients.forEach(rec => {
                    const opt = document.createElement('option');
                    opt.value = rec.id;
                    opt.textContent = `${rec.name} (Parent)`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function viewMessage(id) {
            try {
                await ApiClient.request('teacher.php', { action: 'mark_message_read', messageId: id, teacherId: user.id });
                loadMessages();
            } catch (err) {
                console.error(err);
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[onclick="showTab('${tab}')"]`).classList.add('active');
            document.getElementById('inboxTab').style.display = tab === 'inbox' ? 'block' : 'none';
            document.getElementById('sentTab').style.display = tab === 'sent' ? 'block' : 'none';
            document.getElementById('composeTab').style.display = tab === 'compose' ? 'block' : 'none';
            if (tab === 'compose') loadRecipients();
            if (tab === 'sent') loadSentMessages();
        }

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;

            const recipientId = document.getElementById('recipient').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            try {
                await ApiClient.request('teacher.php', {
                    action: 'send_message',
                    teacherId: user.id,
                    recipientId,
                    subject,
                    message
                });
                showToast('Message sent successfully!', 'success');
                e.target.reset();
                showTab('inbox');
                loadMessages();
            } catch (err) {
                showToast('Failed to send message.', 'error');
            }
            btn.disabled = false;
        });

        loadMessages();
    </script>
</body>
</html>
