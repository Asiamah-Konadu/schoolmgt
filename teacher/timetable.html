<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Timetable | Teacher Portal</title>
    <meta name="description" content="View your assigned class schedule and weekly timetable">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/teacher-portal.css">
    <style>
        .day-section { margin-bottom: 2rem; }
        .day-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .day-badge {
            padding: 0.25rem 1rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .day-Mon { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .day-Tue { background: rgba(139,92,246,0.2); color: #c4b5fd; }
        .day-Wed { background: rgba(16,185,129,0.2); color: #6ee7b7; }
        .day-Thu { background: rgba(245,158,11,0.2); color: #fcd34d; }
        .day-Fri { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .day-Sat { background: rgba(236,72,153,0.2); color: #f9a8d4; }
        .day-Sun { background: rgba(107,114,128,0.2); color: #d1d5db; }

        .lesson-row {
            display: grid;
            grid-template-columns: 130px 1fr 1fr;
            align-items: center;
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }
        .lesson-row:hover { border-color: var(--accent-primary); background: var(--accent-glow); }
        .lesson-time { font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .lesson-subject { font-weight: 600; font-size: 0.95rem; }
        .lesson-class { font-size: 0.8rem; color: var(--text-secondary); text-align: right; }

        .today-indicator {
            font-size: 0.65rem;
            padding: 2px 6px;
            background: rgba(16,185,129,0.2);
            color: #6ee7b7;
            border-radius: 4px;
            font-weight: 600;
        }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
        .print-btn { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: var(--radius-md); padding: 0.4rem 1rem; font-size: 0.8rem; cursor: pointer; transition: var(--transition); }
        .print-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
    </style>
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar flex-col"></aside>

    <main>
        <div class="mobile-top-bar">
            <button onclick="window.UI?.toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;" aria-label="Toggle menu">☰</button>
            <span class="font-bold">My Timetable</span>
            <div style="width:24px;"></div>
        </div>

        <div class="p-8">
            <header class="mb-8 flex justify-between items-start">
                <div>
                    <h1 class="text-2xl">My Weekly Timetable</h1>
                    <p class="text-muted">Your full class schedule for the week. <span id="teacherNameCtx" class="text-primary"></span></p>
                </div>
                <button class="print-btn" onclick="window.print()">🖨 Print Schedule</button>
            </header>

            <section class="max-w-4xl">
                <!-- Summary Cards -->
                <div class="flex gap-4 mb-8" id="summaryCards">
                    <div class="glass-panel p-4 flex-1 text-center">
                        <div style="font-size:2rem; font-weight:700; color:var(--accent-primary);" id="totalLessons">–</div>
                        <div class="text-xs text-muted mt-1">Total Lessons/Week</div>
                    </div>
                    <div class="glass-panel p-4 flex-1 text-center">
                        <div style="font-size:2rem; font-weight:700; color:#6ee7b7;" id="totalClasses">–</div>
                        <div class="text-xs text-muted mt-1">Different Classes</div>
                    </div>
                    <div class="glass-panel p-4 flex-1 text-center">
                        <div style="font-size:2rem; font-weight:700; color:#c4b5fd;" id="todayLessons">–</div>
                        <div class="text-xs text-muted mt-1">Lessons Today</div>
                    </div>
                </div>

                <!-- Timetable by Day -->
                <div class="glass-panel p-6 animate-fade-in">
                    <div id="timetableContent">
                        <p class="text-muted text-sm text-center py-8">Loading timetable...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/firebase-db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/teacher-nav.js"></script>
    <script>
        Auth.requireAuth(['teacher']);

        const DAYS_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        const TODAY_NAME = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = Auth.getCurrentUser();
            document.getElementById('teacherNameCtx').textContent = `— ${user.name}`;

            try {
                const res = await ApiClient.request('teacher.php', { action: 'get_timetable', teacherId: user.id });
                const timetables = res.data || [];

                // Summary stats
                const uniqueClasses = new Set(timetables.map(t => t.class_name)).size;
                const todayCount = timetables.filter(t => t.day === TODAY_NAME).length;
                document.getElementById('totalLessons').textContent = timetables.length;
                document.getElementById('totalClasses').textContent = uniqueClasses;
                document.getElementById('todayLessons').textContent = todayCount;

                const container = document.getElementById('timetableContent');

                if (timetables.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size:3rem; margin-bottom:1rem;">📅</div>
                            <p style="font-size:1.1rem; font-weight:600; margin-bottom:0.5rem;">No schedule assigned yet</p>
                            <p class="text-xs text-muted">Management hasn't imported your timetable. Please check back later.</p>
                        </div>`;
                    return;
                }

                // Group by day
                const byDay = {};
                DAYS_ORDER.forEach(d => byDay[d] = []);
                timetables.forEach(tt => {
                    if (byDay[tt.day]) byDay[tt.day].push(tt);
                });

                let html = '';
                DAYS_ORDER.forEach(day => {
                    const lessons = byDay[day];
                    if (lessons.length === 0) return;

                    lessons.sort((a, b) => a.time_slot.localeCompare(b.time_slot));
                    const dayShort = day.slice(0, 3);
                    const isToday = day === TODAY_NAME;

                    html += `
                    <div class="day-section">
                        <div class="day-header">
                            <span class="day-badge day-${dayShort}">${day}</span>
                            ${isToday ? '<span class="today-indicator">TODAY</span>' : ''}
                            <span class="text-xs text-muted">${lessons.length} lesson${lessons.length !== 1 ? 's' : ''}</span>
                        </div>`;

                    lessons.forEach(tt => {
                        html += `
                        <div class="lesson-row" style="${isToday ? 'border-color: rgba(59,130,246,0.3);' : ''}">
                            <span class="lesson-time">⏰ ${tt.time_slot}</span>
                            <span class="lesson-subject">${tt.subject}</span>
                            <span class="lesson-class">🏫 ${tt.class_name}</span>
                        </div>`;
                    });

                    html += `</div>`;
                });

                container.innerHTML = html;

            } catch (err) {
                document.getElementById('timetableContent').innerHTML =
                    '<p class="text-danger text-sm text-center py-8">Failed to load timetable. Please try again.</p>';
            }
        });
    </script>
</body>
</html>
