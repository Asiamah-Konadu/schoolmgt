<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Promotion | Teacher Portal</title>
    <meta name="description" content="Recommend students for promotion to the next class">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/teacher-portal.css">
    <style>
        .badge-none { background: rgba(255,255,255,0.1); color: var(--text-secondary); padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-recommended { background: rgba(245,158,11,0.2); color: #fbbf24; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-promoted { background: rgba(16,185,129,0.2); color: #6ee7b7; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar flex-col"></aside>

    <main>
        <div class="mobile-top-bar">
            <button onclick="window.UI?.toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;" aria-label="Toggle menu">☰</button>
            <span class="font-bold">Promotion</span>
            <div style="width:24px;"></div>
        </div>

        <div class="p-8">
            <header class="mb-8 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl">Class Promotion</h1>
                    <p class="text-muted">Recommend students for the next academic class.</p>
                </div>
                <div class="glass-panel px-4 py-2" style="border-radius: var(--radius-md);">
                    <span class="text-sm">Assigned Class: <strong id="assignedClassDisplay" class="text-primary"></strong></span>
                </div>
            </header>

            <section class="max-w-4xl">
                <div class="glass-panel p-6 animate-fade-in">
                    <div style="overflow-x: auto;">
                        <table class="w-full text-left" style="border-collapse: collapse;">
                            <thead>
                                <tr style="border-bottom: 1px solid var(--border-color);">
                                    <th class="p-4 text-muted font-medium">Student Name</th>
                                    <th class="p-4 text-muted font-medium">Status</th>
                                    <th class="p-4 text-muted font-medium text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="promotionTableBody">
                                <tr><td colspan="3" class="p-8 text-center text-muted">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/firebase-db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/teacher-nav.js"></script>
    <script>
        Auth.requireAuth(['teacher']);
        const user = Auth.getCurrentUser();
        
        if (!user.assignedClass) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('assignedClassDisplay').textContent = user.assignedClass;

        async function loadPromotionList() {
            const tbody = document.getElementById('promotionTableBody');
            try {
                const res = await ApiClient.request('teacher.php', {
                    action: 'get_promotion_list',
                    className: user.assignedClass
                });

                tbody.innerHTML = '';
                if (res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-muted">No students in this class.</td></tr>';
                    return;
                }

                res.data.forEach(stu => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    
                    let statusBadge = '';
                    let actionBtn = '';

                    if (stu.promotion_status === 'none') {
                        statusBadge = '<span class="badge-none">Not Recommended</span>';
                        actionBtn = `<button onclick="recommend('${stu.id}', '${stu.name.replace(/'/g, "\\'")}', this)" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">⬆ Recommend</button>`;
                    } else if (stu.promotion_status === 'recommended') {
                        statusBadge = '<span class="badge-recommended">⏳ Pending Approval</span>';
                        actionBtn = `<button disabled class="btn btn-outline" style="opacity:0.5; padding: 0.25rem 0.75rem; font-size: 0.75rem;">Awaiting Admin...</button>`;
                    } else if (stu.promotion_status === 'promoted') {
                        statusBadge = '<span class="badge-promoted">✔ Promoted</span>';
                        actionBtn = `<button disabled class="btn btn-outline" style="opacity:0.5; padding: 0.25rem 0.75rem; font-size: 0.75rem;">Completed</button>`;
                    }

                    tr.innerHTML = `
                        <td class="p-4 font-medium text-primary">${stu.name}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right">${actionBtn}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-danger">Failed to load promotion list.</td></tr>';
            }
        }

        window.recommend = async function(id, name, btn) {
            if (!confirm(`Are you sure you want to recommend ${name} for promotion to the next class?`)) return;
            btn.disabled = true;
            btn.textContent = 'Recommending...';
            
            try {
                await ApiClient.request('teacher.php', {
                    action: 'recommend_promotion',
                    studentId: id
                });
                showToast(`Recommended ${name} for promotion.`, 'success');
                loadPromotionList();
            } catch (err) {
                showToast('Failed to recommend student.', 'error');
                btn.disabled = false;
                btn.textContent = '⬆ Recommend';
            }
        }

        document.addEventListener('DOMContentLoaded', loadPromotionList);
    </script>
</body>
</html>
