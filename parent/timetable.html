<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Timetable | Parent Portal</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/parent-portal.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar flex-col"></aside>

    <main>
        <div class="mobile-top-bar">
            <button onclick="window.UI?.toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">☰</button>
            <span class="font-bold">Timetable</span>
            <div style="width:24px;"></div>
        </div>

        <div class="p-8">
            <header class="mb-8">
                <h1 class="text-2xl">Class Schedule</h1>
                <p class="text-muted">Review the weekly timetable. <span class="text-sm font-normal ml-2" id="studentNameContext"></span></p>
            </header>

            <section class="max-w-4xl glass-panel p-6 animate-fade-in" style="overflow-x: auto;">
                <table class="w-full text-left" style="border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border-color);">
                            <th class="p-4 text-muted font-medium w-1/4">Day</th>
                            <th class="p-4 text-muted font-medium w-1/4">Time</th>
                            <th class="p-4 text-muted font-medium w-1/4">Subject</th>
                            <th class="p-4 text-muted font-medium w-1/4">Teacher</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <script src="../js/firebase-db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/parent-nav.js"></script>
    <script>
        Auth.requireAuth(['parent']);
        
        document.addEventListener('DOMContentLoaded', async () => {
            const stored = localStorage.getItem('parentActiveStudent');
            if(!stored) {
                window.location.href = 'dashboard.html';
                return;
            }

            const activeStudent = JSON.parse(stored);
            document.getElementById('studentNameContext').textContent = `(${activeStudent.name})`;

            try {
                const res = await ApiClient.request('parent.php', { action: 'get_timetable', className: activeStudent.class_name });
                const timetables = res.data;

                const tbody = document.getElementById('timetableBody');
                
                if(timetables.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-muted">No schedule defined for this class.</td></tr>';
                } else {
                    const daysMap = { 'Monday':1, 'Tuesday':2, 'Wednesday':3, 'Thursday':4, 'Friday':5 };
                    timetables.sort((a,b) => (daysMap[a.day] - daysMap[b.day]) || a.time_slot.localeCompare(b.time_slot));
                    
                    timetables.forEach(tt => {
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                        tr.innerHTML = `
                            <td class="p-4 font-medium">${tt.day}</td>
                            <td class="p-4 text-secondary">${tt.time_slot}</td>
                            <td class="p-4 text-primary font-medium">${tt.subject}</td>
                            <td class="p-4 text-sm">${tt.teacherName}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch(err) {}
        });
    </script>
</body>
</html>
