<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Announcements | Parent Portal</title>
    <meta name="description" content="Stay updated with school news and circulars">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/parent-portal.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar flex-col"></aside>

    <main>
        <div class="mobile-top-bar">
            <button onclick="window.UI?.toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;" aria-label="Toggle menu">☰</button>
            <span class="font-bold">Announcements</span>
            <div style="width:24px;"></div>
        </div>

        <div class="p-8">
            <header class="mb-8">
                <h1 class="text-2xl">School Announcements</h1>
                <p class="text-muted">Stay updated with the latest news and circulars from the school management.</p>
            </header>

            <section class="max-w-4xl">
                <div class="glass-panel p-6 animate-fade-in" style="max-height: 80vh; overflow-y: auto;">
                    <div class="flex justify-between items-center mb-6">
                        <h2>All Announcements</h2>
                        <span id="announcementCount" class="text-xs text-muted"></span>
                    </div>
                    <div id="announcementsList" class="flex-col gap-4">
                        <p class="text-muted text-sm text-center py-4">Loading...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/firebase-db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/parent-nav.js"></script>
    <script>
        Auth.requireAuth(['parent']);
        
        async function renderAnnouncements() {
            const container = document.getElementById('announcementsList');
            try {
                const res = await ApiClient.request('management.php', { action: 'get_announcements' });
                const list = res.data.filter(a => a.target_audience === 'both' || a.target_audience === 'parents' || a.target_audience === 'all');
                container.innerHTML = '';

                document.getElementById('announcementCount').textContent = `${list.length} announcement${list.length !== 1 ? 's' : ''}`;
                
                if(list.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8">
                            <div style="font-size:2.5rem; margin-bottom:0.75rem;">📢</div>
                            <p class="text-muted">No announcements at this time.</p>
                        </div>`;
                    return;
                }

                list.forEach(ann => {
                    const el = document.createElement('div');
                    el.className = 'glass-panel p-4';
                    el.style.background = 'rgba(255,255,255,0.02)';
                    el.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="text-primary m-0">${ann.title}</h4>
                            <span class="text-xs text-muted px-2 py-1 rounded-full" style="background: var(--bg-secondary);">${ann.target_audience === 'all' || ann.target_audience === 'both' ? 'ALL' : 'PARENTS'}</span>
                        </div>
                        <p class="text-sm text-secondary m-0 mb-3">${ann.content}</p>
                        <div class="text-xs text-muted">
                            📅 ${new Date(ann.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })}
                        </div>
                    `;
                    container.appendChild(el);
                });
            } catch (err) {
                container.innerHTML = '<p class="text-danger text-sm">Failed to load announcements.</p>';
            }
        }

        renderAnnouncements();
    </script>
</body>
</html>
