<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracking | Parent Portal</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/parent-portal.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar flex-col">
        <h2 class="text-center mb-8" style="font-size: 1.25rem;">Parent<br><span class="text-primary text-sm">Portal</span></h2>
        <nav class="flex-col w-full h-full">
            <a href="dashboard.html" class="nav-link">Dashboard Overview</a>
            <a href="finance.html" class="nav-link">Fee Statement</a>
            <a href="attendance.html" class="nav-link active">Attendance Records</a>
            <a href="timetable.html" class="nav-link">Student Timetable</a>
            <a href="assignments.html" class="nav-link">Assignments</a>
            <a href="results.html" class="nav-link">Term Results</a>
            <div style="margin-top: auto;">
                <button onclick="Auth.logout()" class="btn btn-outline w-full mt-8">Logout</button>
            </div>
        </nav>
    </aside>

    <main>
        <div class="mobile-top-bar">
            <button onclick="window.UI?.toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">☰</button>
            <span class="font-bold">Attendance</span>
            <div style="width:24px;"></div>
        </div>

        <div class="p-8">
            <header class="mb-8">
                <h1 class="text-2xl">Attendance Records</h1>
                <p class="text-muted">Monitor your child's attendance and verify teacher presence.</p>
            </header>

            <section class="summary-grid">
                
                <!-- Student Attendance -->
                <div class="card card-2 glass-panel p-6 animate-fade-in" style="max-height: 80vh; overflow-y: auto;">
                    <h2 class="mb-6">Student Activity <span class="text-sm font-normal text-muted ml-2" id="studentNameContext"></span></h2>
                    
                    <table class="w-full text-left" style="border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <th class="p-4 text-muted font-medium">Date & Time</th>
                                <th class="p-4 text-muted font-medium">Category</th>
                                <th class="p-4 text-muted font-medium text-center">Status</th>
                            </tr>
                        </thead>
                        <tbody id="studentAttendanceBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Teachers' Attendance for that Student's Classes -->
                <div class="card card-1 glass-panel p-6 animate-fade-in delay-100" style="max-height: 80vh; overflow-y: auto;">
                    <div class="flex justify-between items-center mb-6">
                        <h2>Teacher Log</h2>
                    </div>
                    
                    <table class="w-full text-left" style="border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <th class="p-4 text-muted font-medium">Date</th>
                                <th class="p-4 text-muted font-medium">Teacher</th>
                                <th class="p-4 text-muted font-medium text-center">Status</th>
                            </tr>
                        </thead>
                        <tbody id="teacherAttendanceBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>

            </section>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.requireAuth(['parent']);
        
        document.addEventListener('DOMContentLoaded', async () => {
            const stored = localStorage.getItem('parentActiveStudent');
            if(!stored) {
                window.location.href = 'dashboard.html'; // Fallback
                return;
            }

            const activeStudent = JSON.parse(stored);
            document.getElementById('studentNameContext').textContent = `(${activeStudent.name})`;

            try {
                // Load Student Attendance (Morning + Lessons)
                const attRes = await ApiClient.request('parent.php', { action: 'get_student_attendance', studentId: activeStudent.id });
                const studentAtt = attRes.data;
                
                const stuBody = document.getElementById('studentAttendanceBody');
                if(studentAtt.length === 0) {
                    stuBody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-muted">No attendance records found yet.</td></tr>';
                } else {
                    studentAtt.forEach(att => {
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                        
                        let timeOutput = new Date(att.created_at).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
                        let catLabel = att.type === 'morning' ? '<span class="text-primary">Morning Arrival</span>' : `<span>Lesson: ${att.subject || ''}</span>`;
                        let presentValid = parseInt(att.is_present) === 1;
                        let statusLabel = presentValid ? '<span class="px-2 py-1 rounded bg-success text-white text-xs" style="background:rgba(16,185,129,0.2);color:#6ee7b7;">Present</span>' : '<span class="px-2 py-1 rounded bg-danger text-white text-xs" style="background:rgba(239,68,68,0.2);color:#fca5a5;">Absent</span>';

                        tr.innerHTML = `
                            <td class="p-4 text-sm">${timeOutput}</td>
                            <td class="p-4 text-sm font-medium">${catLabel}</td>
                            <td class="p-4 text-center">${statusLabel}</td>
                        `;
                        stuBody.appendChild(tr);
                    });
                }

                // Load Teacher Attendance (For the student's class)
                const teachRes = await ApiClient.request('parent.php', { action: 'get_teacher_attendance', className: activeStudent.class_name });
                const validTeacherAtt = teachRes.data;

                const tBody = document.getElementById('teacherAttendanceBody');
                if(validTeacherAtt.length === 0) {
                    tBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-muted">No teacher attendance verified yet for this class.</td></tr>';
                } else {
                    validTeacherAtt.forEach(ta => {
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                        
                        tr.innerHTML = `
                            <td class="p-4 text-sm">${new Date(ta.created_at).toLocaleDateString()}</td>
                            <td class="p-4 text-sm">${ta.teacherName}</td>
                            <td class="p-4 text-sm font-medium text-primary">${ta.subject}</td>
                            <td class="p-4 text-center"><span class="px-2 py-1 rounded bg-success text-white text-xs" style="background:rgba(16,185,129,0.2);color:#6ee7b7;">Verified √</span></td>
                        `;
                        tBody.appendChild(tr);
                    });
                }
            } catch (err) {}
        });
    </script>
</body>
</html>
