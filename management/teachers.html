<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers Directory | Kings Academy Management</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar"></aside>

    <main>
      <div class="mobile-top-bar">
        <button class="mobile-menu-btn" onclick="window.UI?.toggleSidebar()">☰</button>
        <span class="font-bold">Teachers Directory</span>
        <div style="width:38px;"></div>
      </div>

      <div class="p-8">
        <header class="mb-8">
            <h1 class="text-2xl">Teaching Faculty Directory</h1>
            <p class="text-muted">Register teachers, assign teaching subjects, and designate class mentors.</p>
        </header>

        <section class="max-w-6xl grid gap-8" style="display: grid; grid-template-columns: 340px 1fr;">
            
            <!-- Create Form -->
            <div class="glass-panel p-6 animate-fade-in" style="height: fit-content;">
                <h2 class="mb-5">👨‍🏫 Register Teacher</h2>
                <form id="teacherForm">
                    <div class="form-group mb-3">
                        <label class="form-label" for="teacherName">Full Name</label>
                        <input type="text" id="teacherName" class="form-control" placeholder="e.g. Jane Smith" required>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label" for="teacherEmail">Email Address (Login ID)</label>
                        <input type="email" id="teacherEmail" class="form-control" placeholder="e.g. jane.smith@school.edu" required>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label" for="subjects">Teaching Subjects (Comma Separated)</label>
                        <input type="text" id="subjects" class="form-control" placeholder="e.g. Mathematics, Physics" required>
                    </div>
                    <div class="form-group mb-4">
                        <label class="form-label" for="assignedClass">Assigned Class (Mentor / Form Teacher)</label>
                        <input type="text" id="assignedClass" class="form-control" placeholder="e.g. Grade 10A (Optional)">
                        <small class="text-muted mt-1 block text-xs">Leave blank if strictly a subject teacher.</small>
                    </div>
                    <button type="submit" id="submitTchBtn" class="btn btn-primary w-full">Register Faculty Member</button>
                </form>
            </div>

            <!-- List View -->
            <div class="glass-panel p-6 animate-fade-in delay-100">
                <div class="flex justify-between items-center mb-5">
                    <h2>Registered Teaching Staff</h2>
                    <input type="text" id="teacherFilter" oninput="filterTeachers()" placeholder="🔍 Filter faculty..." class="form-control" style="max-width: 200px; padding: 0.4rem 0.75rem; font-size: 0.8rem;">
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Teacher ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Assigned Subjects</th>
                                <th>Mentorship Class</th>
                                <th class="text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="teacherTableBody">
                            <tr><td colspan="6" class="p-6 text-center text-muted">Loading faculty...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
      </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/management-nav.js"></script>
    <script>
        Auth.requireAuth(['management']);
        let teachersData = [];

        async function renderTable() {
            const tbody = document.getElementById('teacherTableBody');
            try {
                const res = await ApiClient.request('management.php', { action: 'get_teachers' });
                teachersData = res.data || [];
                displayTeachers(teachersData);
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-danger">Failed to load teacher directory.</td></tr>';
            }
        }

        function displayTeachers(list) {
            const tbody = document.getElementById('teacherTableBody');
            tbody.innerHTML = '';
            
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-muted">No teachers registered.</td></tr>';
                return;
            }

            list.forEach(item => {
                const subjects = Array.isArray(item.subjects) ? item.subjects : (item.subjects ? item.subjects.split(',') : []);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="font-bold text-primary">${item.id}</td>
                    <td class="font-medium">${item.name}</td>
                    <td class="text-secondary text-sm">${item.email}</td>
                    <td>
                        <div class="flex flex-wrap gap-1">
                            ${subjects.map(s => `<span class="badge badge-primary text-xs">${s.trim()}</span>`).join('')}
                        </div>
                    </td>
                    <td>
                        ${item.assignedClass ? `<span class="badge badge-success">${item.assignedClass}</span>` : '<span class="text-muted text-xs">—</span>'}
                    </td>
                    <td class="text-right">
                        <button onclick="deleteTeacher('${item.id}')" class="text-danger" style="background:none;border:none;cursor:pointer;font-weight:600;font-size:0.75rem;">🗑 Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTeachers() {
            const q = document.getElementById('teacherFilter').value.toLowerCase();
            const filtered = teachersData.filter(t => 
                (t.name || '').toLowerCase().includes(q) ||
                (t.email || '').toLowerCase().includes(q) ||
                (t.id || '').toLowerCase().includes(q)
            );
            displayTeachers(filtered);
        }

        document.getElementById('teacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitTchBtn');
            btn.disabled = true;
            btn.textContent = 'Registering...';

            const name = document.getElementById('teacherName').value;
            const email = document.getElementById('teacherEmail').value;
            const subjects = document.getElementById('subjects').value.split(',').map(s=>s.trim());
            const assignedClass = document.getElementById('assignedClass').value;

            try {
                const res = await ApiClient.request('management.php', {
                    action: 'create_teacher',
                    name, email, subjects, assignedClass
                });
                showToast(`Teacher registered! Login ID: ${res.teacherId} (Password: password123)`, 'success');
                e.target.reset();
                renderTable();
            } catch (err) {}
            
            btn.disabled = false;
            btn.textContent = 'Register Faculty Member';
        });

        window.deleteTeacher = async function(tId) {
            if (confirm('Delete this Teacher profile?')) {
                try {
                    await ApiClient.request('management.php', { action: 'delete_teacher', id: tId });
                    showToast('Deleted teacher profile.', 'success');
                    renderTable();
                } catch (err) {}
            }
        };

        renderTable();
    </script>
</body>
</html>
