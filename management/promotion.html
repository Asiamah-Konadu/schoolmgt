<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion Management | Kings Academy Management</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar"></aside>

    <main>
      <div class="mobile-top-bar">
        <button class="mobile-menu-btn" onclick="window.UI?.toggleSidebar()">☰</button>
        <span class="font-bold">Student Promotions</span>
        <div style="width:38px;"></div>
      </div>

      <div class="p-8">
        <header class="mb-8">
            <h1 class="text-2xl">Annual Student Promotions</h1>
            <p class="text-muted">Review, validate, and authorize student promotion recommendations submitted by mentorship teachers.</p>
        </header>

        <section class="max-w-5xl">
            <div class="glass-panel p-6 animate-fade-in">
                <div class="flex justify-between items-center mb-5">
                    <h2>Pending Promotion Recommendations</h2>
                    <button class="btn btn-outline btn-sm" onclick="loadRecommended()">🔄 Refresh</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Current Class</th>
                                <th>Recommended Next Class</th>
                                <th class="text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="promotionTableBody">
                            <tr><td colspan="4" class="p-6 text-center text-muted">Loading recommendations...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
      </div>
    </main>

    <script type="module" src="../js/firebase-db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/management-nav.js"></script>
    <script>
        Auth.requireAuth(['management']);

        const classSequence = [
            'Nursery 1', 'Nursery 2', 'KG 1', 'KG 2', 
            'Grade 1', 'Grade 2', 'Grade 3', 'Grade 4', 'Grade 5', 'Grade 6', 
            'Grade 7', 'Grade 8', 'Grade 9', 'Grade 10A', 'Grade 10B', 'Grade 11', 'Grade 12',
            'Class 1', 'Class 2', 'Class 3', 'Class 4', 'Class 5', 'Class 6', 
            'JHS 1', 'JHS 2', 'JHS 3'
        ];

        async function loadRecommended() {
            const tbody = document.getElementById('promotionTableBody');
            try {
                const res = await ApiClient.request('management.php', { action: 'get_recommended_promotions' });
                tbody.innerHTML = '';
                const list = res.data || [];
                
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-muted">No pending promotion recommendations from teachers.</td></tr>';
                    return;
                }

                list.forEach(item => {
                    const currentCls = item.class || '';
                    const currentIndex = classSequence.indexOf(currentCls);
                    const nextClass = (currentIndex !== -1 && currentIndex < classSequence.length - 1) ? classSequence[currentIndex + 1] : 'Graduated / Higher Grade';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="font-bold text-primary">${item.name}</td>
                        <td><span class="badge badge-primary">${item.class}</span></td>
                        <td><span class="badge badge-success">${nextClass}</span></td>
                        <td class="text-right">
                            <button onclick="approvePromotion('${item.id}', '${item.name.replace(/'/g, "\\'")}', '${nextClass}')" class="btn btn-primary btn-sm">✓ Approve &amp; Promote</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-danger">Failed to load promotion requests.</td></tr>';
            }
        }

        window.approvePromotion = async function(id, name, nextClass) {
            if (!confirm(`Promote ${name} to ${nextClass}?`)) return;

            try {
                await ApiClient.request('management.php', {
                    action: 'approve_promotion',
                    studentId: id,
                    nextClass: nextClass
                });
                showToast(`${name} has been promoted to ${nextClass}.`, 'success');
                loadRecommended();
            } catch (err) {
                showToast('Failed to approve promotion.', 'error');
            }
        };

        loadRecommended();
    </script>
</body>
</html>
