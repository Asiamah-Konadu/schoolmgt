<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Management Dashboard | School System</title>
    <link rel="stylesheet" href="../css/index.css" />
    <style>
      .dashboard-layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        min-height: 100vh;
        font-size: small;
      }
      .sidebar {
        background: var(--bg-glass);
        border-right: 1px solid var(--border-color);
        padding: 2rem 1rem;
        width: 100%;
      }
      .nav-link {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        border-radius: var(--radius-md);
        margin-bottom: 0.5rem;
        transition: var(--transition);
      }
      .nav-link:hover,
      .nav-link.active {
        background: var(--accent-glow);
        color: var(--text-primary);
      }
      .stat-card {
        padding: 1.5rem;
        text-align: center;
        border-radius: var(--radius-lg);
      }
      .stat-value {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent-primary);
        text-shadow: 0 0 10px var(--accent-glow);
      }
      .mobile-top-bar { 
  display: none; 
  padding: 1rem; 
  background: var(--bg-glass); 
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color); 
  align-items: center; 
  justify-content: space-between; 
  position: sticky; 
  top: 0; 
  z-index: 100; 
}

.sidebar-overlay { 
  display: none; 
  position: fixed; 
  inset: 0; 
  background: rgba(0,0,0,0.5); 
  z-index: 900; 
  backdrop-filter: blur(4px); 
}

/* Summary Grid System */
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.card-1 { grid-column: span 1; }
.card-2 { grid-column: span 2; }
.card-3 { grid-column: span 3; }

@media (max-width: 425px) {
    .dashboard-layout { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 1000; transform: translateX(-100%); }
    .sidebar.active { transform: translateX(0); }
    .mobile-top-bar { display: flex; }
    .p-8 { padding: 1.5rem; }
}

@media (max-width: 425px) {
    .summary-grid { grid-template-columns: 1fr; }
    .card-2, .card-3 { grid-column: span 1; }
}
    </style>
  </head>
  <body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar flex-col">
      <h2 class="text-center mb-8" style="font-size: 1.25rem">
        Kings Accademy<br /><span class="text-primary text-sm">Management</span>
      </h2>

      <nav class="flex-col w-full h-full">
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="announcements.html" class="nav-link">Announcements</a>
        <a href="students.html" class="nav-link">Students & Parents</a>
        <a href="teachers.html" class="nav-link">Teachers</a>
        <a href="timetable.html" class="nav-link">Timetable Import</a>
        <a href="results.html" class="nav-link">Results Manager</a>
        <a href="finance.html" class="nav-link">Finance Manager</a>

        <div style="margin-top: auto">
          <button onclick="Auth.logout()" class="btn btn-outline w-full mt-8">
            Logout
          </button>
        </div>
      </nav>
    </aside>

    <main>
      <div class="mobile-top-bar">
        <button onclick="window.UI?.toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">☰</button>
        <span class="font-bold">Admin Dashboard</span>
        <div style="width:24px;"></div>
      </div>
      <div class="p-8">
      <header class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-2xl">Overview</h1>
          <p class="text-muted">
            Welcome back, <span id="userNameDisplay">Admin</span>
          </p>
        </div>
      </header>

      <section class="max-w-6xl mx-auto">
        <div class="grid flex gap-6 mb-8">
          <div
            class="glass-panel stat-card flex-1 select-none transition hover:scale-105"
            style="cursor: default; transform-origin: center"
          >
            <h3 class="text-muted">Total Students</h3>
            <div class="stat-value" id="totalStudents">0</div>
          </div>
          <div
            class="glass-panel stat-card flex-1 select-none transition hover:scale-105"
            style="cursor: default; transform-origin: center"
          >
            <h3 class="text-muted">Total Teachers</h3>
            <div class="stat-value" id="totalTeachers">0</div>
          </div>
          <div
            class="glass-panel stat-card flex-1 select-none transition hover:scale-105"
            style="cursor: default; transform-origin: center"
          >
            <h3 class="text-muted">Active Classes</h3>
            <div class="stat-value" id="totalClasses">0</div>
          </div>
        </div>

        <div class="glass-panel p-6 animate-fade-in delay-100">
          <div class="flex justify-between items-center mb-4">
            <h2>Recent Announcements</h2>
            <a href="announcements.html" class="text-sm">Manage All ></a>
          </div>
          <div id="recentAnnouncementsList" class="flex-col gap-4">
            <!-- Announcements injected via JS -->
          </div>
        </div>
      </section>
      </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      Auth.requireAuth(["management"]);

      document.addEventListener("DOMContentLoaded", async () => {
        const user = Auth.getCurrentUser();
        document.getElementById("userNameDisplay").textContent = user.name;

        try {
          // Fetch Stats
          const stats = await ApiClient.request("management.php", {
            action: "get_stats",
          });
          document.getElementById("totalStudents").textContent = stats.students;
          document.getElementById("totalTeachers").textContent = stats.teachers;
          document.getElementById("totalClasses").textContent = stats.classes;

          // Fetch Announcements
          const annRes = await ApiClient.request("management.php", {
            action: "get_announcements",
          });
          const allAnnouncements = annRes.data;
          const container = document.getElementById("recentAnnouncementsList");

          if (allAnnouncements.length === 0) {
            container.innerHTML =
              '<p class="text-muted">No recent announcements.</p>';
          } else {
            allAnnouncements.slice(0, 3).forEach((ann) => {
              const el = document.createElement("div");
              el.className = "glass-panel p-4";
              el.style.background = "rgba(255,255,255,0.03)";
              el.innerHTML = `
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="text-primary m-0">${ann.title}</h4>
                                <span class="text-xs text-muted px-2 py-1 rounded-full" style="background: var(--bg-secondary);">${ann.target_audience.toUpperCase()}</span>
                            </div>
                            <p class="text-sm text-secondary m-0">${ann.content}</p>
                            <div class="text-xs text-muted mt-2">${new Date(ann.created_at).toLocaleDateString()}</div>
                        `;
              container.appendChild(el);
            });
          }
        } catch (err) {
          console.error("Failed to load dashboard data");
        }
      });
    </script>
  </body>
</html>
