<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Kings Academy Management</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar"></aside>

    <main>
      <div class="mobile-top-bar">
        <button class="mobile-menu-btn" onclick="window.UI?.toggleSidebar()">☰</button>
        <span class="font-bold">Announcements</span>
        <div style="width:38px;"></div>
      </div>

      <div class="p-8">
        <header class="mb-8">
            <h1 class="text-2xl">Broadcasts &amp; Announcements</h1>
            <p class="text-muted">Publish notifications to Teachers, Parents, or the entire school community.</p>
        </header>

        <section class="max-w-6xl grid gap-8" style="display: grid; grid-template-columns: 1fr 1.5fr;">
            
            <!-- Create Form -->
            <div class="glass-panel p-6 animate-fade-in" style="height: fit-content;">
                <h2 class="mb-5">📢 Create Broadcast</h2>
                <form id="announcementForm">
                    <div class="form-group">
                        <label class="form-label" for="title">Announcement Title</label>
                        <input type="text" id="title" class="form-control" placeholder="e.g. End of Term Examination Timetable" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="target">Target Audience</label>
                        <select id="target" class="form-control" required>
                            <option value="both">Both (Teachers &amp; Parents)</option>
                            <option value="teachers">Teachers Only</option>
                            <option value="parents">Parents Only</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="content">Message Content</label>
                        <textarea id="content" class="form-control" rows="5" placeholder="Type announcement details here..." required style="resize: vertical;"></textarea>
                    </div>
                    <button type="submit" id="submitAnnBtn" class="btn btn-primary w-full mt-2">Publish Announcement</button>
                </form>
            </div>

            <!-- List View -->
            <div class="glass-panel p-6 animate-fade-in delay-100" style="max-height: 80vh; overflow-y: auto;">
                <div class="flex justify-between items-center mb-5">
                    <h2>Active Broadcasts</h2>
                    <span id="annCount" class="text-xs text-muted"></span>
                </div>
                <div id="announcementsList" class="flex-col gap-4">
                    <p class="text-muted text-sm py-4">Loading announcements...</p>
                </div>
            </div>

        </section>
      </div>
    </main>

    <script type="module" src="../js/firebase-db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/management-nav.js"></script>
    <script>
        Auth.requireAuth(['management']);
        
        async function renderAnnouncements() {
            const container = document.getElementById('announcementsList');
            try {
                const res = await ApiClient.request('management.php', { action: 'get_announcements' });
                const list = res.data || [];
                container.innerHTML = '';
                document.getElementById('annCount').textContent = `${list.length} published`;
                
                if (list.length === 0) {
                    container.innerHTML = '<p class="text-muted text-center py-6">No announcements published yet.</p>';
                    return;
                }

                list.forEach(ann => {
                    const el = document.createElement('div');
                    el.className = 'preview-item flex-col items-start gap-2';
                    el.style.background = 'rgba(255,255,255,0.02)';
                    
                    const audColor = ann.target_audience === 'teachers' ? 'badge-warning' : (ann.target_audience === 'parents' ? 'badge-success' : 'badge-primary');
                    
                    el.innerHTML = `
                        <div class="flex justify-between items-center w-full">
                            <h4 class="text-primary m-0">${ann.title}</h4>
                            <span class="badge ${audColor} uppercase">${ann.target_audience}</span>
                        </div>
                        <p class="text-sm text-secondary m-0 mb-1" style="line-height:1.5;">${ann.content}</p>
                        <div class="flex justify-between items-center w-full text-xs text-muted pt-2 border-t" style="border-color: rgba(255,255,255,0.05);">
                            <span>📅 ${new Date(ann.created_at).toLocaleDateString()}</span>
                            <button onclick="deleteAnnouncement('${ann.id}')" class="text-danger" style="background:none;border:none;cursor:pointer;font-weight:600;font-size:0.75rem;">🗑 Delete</button>
                        </div>
                    `;
                    container.appendChild(el);
                });
            } catch (err) {
                container.innerHTML = '<p class="text-danger text-center py-6">Failed to load announcements.</p>';
            }
        }

        document.getElementById('announcementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitAnnBtn');
            btn.disabled = true;
            btn.textContent = 'Publishing...';
            
            const title = document.getElementById('title').value;
            const target = document.getElementById('target').value;
            const content = document.getElementById('content').value;

            try {
                await ApiClient.request('management.php', {
                    action: 'create_announcement',
                    title, target, content
                });
                showToast('Announcement published successfully!', 'success');
                e.target.reset();
                renderAnnouncements();
            } catch (err) {}
            btn.disabled = false;
            btn.textContent = 'Publish Announcement';
        });

        window.deleteAnnouncement = async function(id) {
            if (confirm('Delete this announcement?')) {
                try {
                    await ApiClient.request('management.php', { action: 'delete_announcement', id });
                    showToast('Deleted announcement.', 'success');
                    renderAnnouncements();
                } catch (err) {}
            }
        };

        renderAnnouncements();
    </script>
</body>
</html>
